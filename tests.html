<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二分探索ラボ テスト</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <h2 style="margin-bottom: var(--space-sm);">logic.js テスト</h2>
  <p id="sum" class="banner"></p>
  <div class="table-wrap" style="margin-top: var(--space-sm);"><table class="log"><tbody id="list"></tbody></table></div>
</main>
<script src="js/logic.js"></script>
<script src="js/tests.js"></script>
<script>
  const rs = window.BS_TEST_RESULTS, ng = rs.filter(r => !r.ok);
  const sum = document.getElementById('sum');
  sum.textContent = (rs.length - ng.length) + ' / ' + rs.length + ' passed';
  sum.classList.add(ng.length ? 'banner--ng' : 'banner--ok');
  const list = document.getElementById('list');
  rs.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td><td></td>';
    tr.cells[0].textContent = r.ok ? 'OK' : 'NG';
    tr.cells[1].textContent = r.name;
    tr.cells[2].textContent = r.ok ? '' : JSON.stringify(r.actual) + ' ≠ ' + JSON.stringify(r.expected);
    list.appendChild(tr);
  });
</script>
</body>
</html>
